name: Convención de commits

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  HUSKY: '0'

concurrency:
  group: commitlint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Validar commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Validar los commits del cambio
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$HEAD_SHA" =~ ^0+$ ]]; then
            exit 0
          fi

          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null || git fetch origin "$BASE_SHA"
            range="$BASE_SHA..$HEAD_SHA"
          elif base=$(git merge-base "origin/$DEFAULT_BRANCH" "$HEAD_SHA"); then
            # Rama nueva: validar solo sus commits, sin arrastrar el historial antiguo.
            range="$base..$HEAD_SHA"
          else
            # Sin ancestro común, incluir también el primer commit.
            range="$HEAD_SHA"
          fi

          git rev-list --reverse --no-merges "$range" > "$RUNNER_TEMP/commitlint-shas"
          while IFS= read -r sha; do
            echo "Validando $sha"
            git show --no-patch --format=%B "$sha" | npm run commitlint -- --verbose
          done < "$RUNNER_TEMP/commitlint-shas"
